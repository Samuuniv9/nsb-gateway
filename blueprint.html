<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>North Star Blueprint — NSB</title>
<meta name="description" content="North Star Blueprint — connexion établie.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120e09">
<style>
/* =========================================================
   NORTH STAR BLUEPRINT — landing page du flyer (v0.3, test)
   Auteur : Samuel Nubery — NSB (North Star Business)
   Référence visuelle : flyer Canva « Flyer A5 recto-verso North Star Blueprint »
   Page autonome : ne touche pas à index.html (carte NFC).
   ========================================================= */
:root{
  --bg:#120e09; --copper:#d98a4e; --copper-dim:#7a4a2b;
  --ink:#f1e4d3; --muted:#b49b82; --violet:#a46bff; --violet-glow:#7b3cff;
  --term:#c9b3ff;
  --mono:"Courier Prime","Courier New",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--mono);-webkit-font-smoothing:antialiased;min-height:100svh;
  background:radial-gradient(120% 60% at 50% 0%,#2a1d12 0%,var(--bg) 60%) fixed}
.bp{max-width:460px;margin:0 auto;padding:20px 16px 40px;position:relative}

/* Repères de coupe (croix) comme sur le flyer */
.cross{position:fixed;width:22px;height:22px;opacity:.5;pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:var(--copper-dim)}
.cross::before{left:50%;top:0;width:1px;height:100%}
.cross::after{top:50%;left:0;height:1px;width:100%}
.c1{top:10px;left:10px}.c2{top:10px;right:10px}.c3{bottom:10px;left:10px}.c4{bottom:10px;right:10px}

.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.logo{color:var(--copper);font-weight:700;font-size:18px;letter-spacing:.12em}
.logo span{font-size:12px;margin-left:2px;vertical-align:super}
.status{display:inline-flex;align-items:center;gap:8px}
.led{width:8px;height:8px;border-radius:50%;background:var(--copper-dim);animation:pulse 1s steps(2) infinite}
.on .led{background:var(--violet);box-shadow:0 0 10px var(--violet);animation:none}
@keyframes pulse{50%{opacity:.2}}

/* Cadre de la machine (repris du verso) */
.frame{position:relative;margin:16px 0 0;border:1px solid var(--copper-dim);padding:6px;background:#0d0a06}
.machine{position:relative;display:block;width:100%;aspect-ratio:4/5;overflow:hidden;background:#0d0a06}
.machine img,.machine video{display:block;width:100%;height:100%;object-fit:cover}
.machine video{position:absolute;inset:0}

/* Titre façon verso */
.title{text-align:center;margin:18px 0 0;color:var(--copper);font-weight:400;
  font-size:clamp(20px,6.4vw,28px);letter-spacing:.16em;text-transform:uppercase}

/* Mot de passe : l'énigme sous le titre */
.intro{margin:0 0 16px;text-align:center;font-size:15px;line-height:1.6;color:var(--ink)}
.lockline{margin:16px auto 0;width:max-content;max-width:100%;padding:6px 12px;border:1px solid #3d2a5e;
  border-radius:8px;background:#140d20;color:var(--term);font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.cur{display:inline-block;margin-left:4px;animation:pulse 1s steps(2) infinite}
.passhint{margin:8px 0 0;text-align:center;font-size:13px;color:var(--muted)}

/* Mission + bouton principal */
.mission{margin:26px 0 0}
.mission-label{margin:0 0 8px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--copper-dim);text-align:center}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;
  padding:14px 18px;border-radius:14px;text-decoration:none;font-family:var(--mono);
  font-size:18px;font-weight:700;letter-spacing:.04em;color:#140b22;
  background:linear-gradient(180deg,#c39bff,var(--violet));
  box-shadow:0 0 0 1px #d9c2ff inset,0 8px 28px rgba(123,60,255,.45)}
.cta:active{transform:translateY(1px)}
.cta:focus-visible{outline:3px solid var(--copper);outline-offset:3px}
.cta svg{width:18px;height:18px}

/* Commandes verrouillées */
.panel{margin:30px 0 0;border-top:1px dashed var(--copper-dim);padding-top:14px}
.panel-label{margin:0 0 10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper-dim)}
.keys{display:flex;gap:10px}
.key{flex:1;height:52px;border:1px solid #3a2a1c;border-radius:10px;display:grid;place-items:center;
  color:#8a6a50;background:#17110b;font:inherit;font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.key::after{content:"🔒";font-size:9px;margin-top:2px;opacity:.6}
.key{grid-template-rows:auto auto}
.key.is-on{border-color:#5b3a8f;color:var(--term);background:#160f22}
.key:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

/* Terminal de réponse des commandes */
.term{margin:12px 0 0;padding:12px;border:1px solid #3d2a5e;border-radius:10px;background:#0e0916;
  color:var(--term);font-size:14px;line-height:1.5;min-height:0}
.term[hidden]{display:none}
.term p{margin:0 0 6px}
.term .deny{color:#ff8a8a}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.choice{font:inherit;font-size:13px;padding:9px 12px;border-radius:999px;border:1px solid #5b3a8f;
  background:transparent;color:var(--term);cursor:pointer}
.choice:active{background:#2a1a45}

/* Séquence d'activation (ajoutée par JS) */
.boot .title,.boot .mission{opacity:0;animation:in .5s ease-out forwards}
.boot .title{animation-delay:.6s}.boot .mission{animation-delay:1s}
.done .title,.done .mission{opacity:1!important}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.boot *{opacity:1!important}}
</style>
</head>
<body>
<span class="cross c1"></span><span class="cross c2"></span><span class="cross c3"></span><span class="cross c4"></span>

<main class="bp" id="bp">
  <header class="top">
    <span class="logo" aria-label="NSB — North Star Business">NSB<span aria-hidden="true">★</span></span>
    <span class="status" id="status" role="status"><span class="led"></span><span id="status-txt">Connexion…</span></span>
  </header>

  <div class="frame">
    <div class="machine" id="machine">
      <!-- Image fixe (1re image de la vidéo) : affichée si la vidéo ne se lance pas -->
      <img id="poster" src="docs/img/blueprint/machine-poster.jpg" alt="La machine North Star Blueprint : un ordinateur sculpté couleur cuivre, avec un œil violet." width="720" height="900">
    </div>
  </div>

  <h1 class="title">North Star Blueprint</h1>

  <section class="mission">
    <p class="mission-label" id="mission-label">Mission 01 disponible</p>
    <p class="intro" id="intro"></p>
    <!-- Lien de repli (sans JavaScript) : formulaire Tally existant « NSB · Test 1 · Vague 1 » -->
    <a class="cta" id="cta" href="https://tally.so/r/XxKMvY?source=flyer" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8Z"/></svg>
      <span id="cta-txt">Lancer : Calibrage</span>
    </a>
    <p class="lockline"><span aria-hidden="true">⌁ </span><span id="lock-txt">Mot de passe requis</span><span class="cur" aria-hidden="true">▮</span></p>
    <p class="passhint" id="passhint">Indice : il est imprimé sur le flyer.</p>
  </section>

  <section class="panel">
    <p class="panel-label">Autres commandes — verrouillées</p>
    <div class="keys" id="keys">
      <button class="key" type="button" data-k="1" aria-label="Commande verrouillée 1">⟁</button>
      <button class="key" type="button" data-k="2" aria-label="Commande verrouillée 2">⌬</button>
      <button class="key" type="button" data-k="3" aria-label="Commande verrouillée 3">⍜</button>
    </div>
    <div class="term" id="term" aria-live="polite" hidden></div>
  </section>
</main>

<script>
/* =========================================================
   RÉGLAGES — tout ce qui se modifie est ici
   ========================================================= */
var CONFIG = {
  // Formulaire Tally existant « NSB · Test 1 · Vague 1 » (lien répondant)
  TALLY_URL: 'https://tally.so/r/XxKMvY',
  SOURCE: 'flyer',                       // champ caché "source" (déjà dans le formulaire)
  // Nom de jeu du test visuel 1 (affiché sur la page, pas dans Tally)
  MISSION_LABEL: 'Mission 01 disponible',
  MISSION_BUTTON: 'Lancer : Calibrage',
  // Texte d'introduction au-dessus du bouton ('' pour le masquer). Suit l'ordre du formulaire : mood → notes → prix
  INTRO: 'Calibrage requis. Choisis ton mood, note chaque boisson sur 20, devine son prix. La machine apprend tes goûts.',
  // Énigme du mot de passe (jamais le code lui-même ici)
  LOCK_TEXT: 'Mot de passe requis',
  PASS_HINT: 'Indice : il est imprimé sur le flyer.',
  // Vidéo de la machine (muette, en boucle).
  // MP4 d'abord (iPhone), WebM en secours. [] = image fixe seulement.
  VIDEO: ['docs/img/blueprint/machine.mp4', 'docs/img/blueprint/machine.webm'],
  // Statistiques GoatCounter (ton compte existant, sans cookies). Désactivées.
  // Pour activer : 'https://nsb.goatcounter.com/count'
  STATS: ''
};

/* Réponses des commandes verrouillées : rien n'est déverrouillé, rien n'est collecté
   (sauf un comptage anonyme du choix si STATS est activé). */
var LOCKS = {
  '1': 'Module ⟁ — ACCÈS REFUSÉ.',
  '2': 'Module ⌬ — SIGNAL INSUFFISANT.',
  '3': 'Module ⍜ — CLÉ MANQUANTE.'
};
var QUESTION = 'Que serais-tu prêt à donner pour le déverrouiller ?';
var OFFERS = [
  ['avis', 'Mon avis'],
  ['temps', '5 minutes de mon temps'],
  ['idee', 'Une idée de boisson'],
  ['rien', 'Rien, je regarde']
];
var AFTER = 'Proposition enregistrée par la machine. Le module reste verrouillé… pour l\'instant.';

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);

  // --- Origine du QR (?origine_qr=lieu_a), nettoyée et gardée pendant la visite
  var raw = (params.get('origine_qr') || '').toLowerCase().trim();
  var origine = /^[a-z0-9_-]{1,40}$/.test(raw) ? raw : '';
  try {
    if (origine) sessionStorage.setItem('nsb_origine_qr', origine);
    else origine = sessionStorage.getItem('nsb_origine_qr') || '';
  } catch (e) {}
  if (!origine) origine = raw ? 'inconnu' : 'direct';

  // --- Lien vers Tally avec les champs cachés
  var vague = '';
  function buildLink() {
    try {
      var u = new URL(CONFIG.TALLY_URL);
      u.searchParams.set('origine_qr', origine);
      u.searchParams.set('source', CONFIG.SOURCE);
      if (vague !== '') u.searchParams.set('vague', vague);
      $('cta').href = u.toString();
    } catch (e) {}
  }
  buildLink();
  fetch('docs/catalogue.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (c) { if (c && c.vague_active != null) { vague = String(c.vague_active); buildLink(); } })
    .catch(function () {});

  // --- Textes réglables
  $('mission-label').textContent = CONFIG.MISSION_LABEL;
  $('cta-txt').textContent = CONFIG.MISSION_BUTTON;
  if (CONFIG.INTRO) $('intro').textContent = CONFIG.INTRO; else $('intro').remove();
  $('lock-txt').textContent = CONFIG.LOCK_TEXT;
  if (CONFIG.PASS_HINT) $('passhint').textContent = CONFIG.PASS_HINT; else $('passhint').remove();

  // --- Vidéo de la machine (si fournie)
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var machine = $('machine');
  if (CONFIG.VIDEO && CONFIG.VIDEO.length) {
    var v = document.createElement('video');
    v.poster = 'docs/img/blueprint/machine-poster.jpg';
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('playsinline', ''); v.setAttribute('muted', ''); v.setAttribute('aria-hidden', 'true');
    CONFIG.VIDEO.forEach(function (src, i) {
      var so = document.createElement('source');
      so.src = src; so.type = /\.webm$/.test(src) ? 'video/webm' : 'video/mp4';
      // Repli : si aucune source ne passe, on retire la vidéo et l'image fixe reste
      if (i === CONFIG.VIDEO.length - 1) so.addEventListener('error', function () { v.remove(); });
      v.appendChild(so);
    });
    machine.appendChild(v);
    if (!reduce) { v.autoplay = true; var pl = v.play(); if (pl && pl.catch) pl.catch(function () {}); }
  }

  // --- Séquence d'activation
  var bp = $('bp');
  if (!reduce) bp.classList.add('boot');
  setTimeout(function () { bp.classList.add('done'); }, 3000); // filet de sécurité
  setTimeout(function () {
    $('status').classList.add('on');
    $('status-txt').textContent = 'Connexion établie';
  }, reduce ? 0 : 900);

  // --- Statistiques (désactivées par défaut)
  var count = function () {};
  if (CONFIG.STATS) {
    count = function (path, title, event) {
      try { if (window.goatcounter && goatcounter.count) goatcounter.count({ path: path, title: title, event: event }); } catch (e) {}
    };
    window.goatcounter = { no_onload: true };
    var s = document.createElement('script');
    s.async = true; s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', CONFIG.STATS);
    s.onload = function () { count('visite-blueprint-' + origine, 'Visite Blueprint (' + origine + ')', false); };
    document.head.appendChild(s);
    $('cta').addEventListener('click', function () {
      count('clic-calibrage-' + origine, 'Clic Calibrage (' + origine + ')', true);
    });
  }

  // --- Commandes verrouillées : message + question, le module reste verrouillé
  var term = $('term');
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  document.querySelectorAll('.key').forEach(function (key) {
    key.addEventListener('click', function () {
      document.querySelectorAll('.key').forEach(function (k) { k.classList.toggle('is-on', k === key); });
      var k = key.getAttribute('data-k');
      term.hidden = false;
      term.innerHTML = '<p class="deny">&gt; ' + esc(LOCKS[k]) + '</p><p>&gt; ' + esc(QUESTION) + '</p>' +
        '<div class="choices">' + OFFERS.map(function (o) {
          return '<button type="button" class="choice" data-o="' + o[0] + '">' + esc(o[1]) + '</button>';
        }).join('') + '</div>';
      term.querySelectorAll('.choice').forEach(function (c) {
        c.addEventListener('click', function () {
          count('verrou-' + k + '-' + c.getAttribute('data-o') + '-' + origine, 'Verrou ' + k + ' : ' + c.textContent, true);
          term.innerHTML = '<p class="deny">&gt; ' + esc(LOCKS[k]) + '</p><p>&gt; ' + esc(AFTER) + '</p>';
        });
      });
    });
  });
})();
</script>
</body>
</html>
